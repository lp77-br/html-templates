<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Lost in space</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #0a0a0f;
  color: #f0f0f5; min-height: 100vh; display: grid; place-items: center;
  overflow: hidden; padding: 24px; }
.stars { position: fixed; inset: 0; z-index: 0;
  background-image: radial-gradient(2px 2px at 20px 30px, #fff, transparent),
    radial-gradient(2px 2px at 40px 70px, #fff, transparent),
    radial-gradient(1px 1px at 90px 40px, #fff, transparent),
    radial-gradient(2px 2px at 130px 80px, #fff, transparent),
    radial-gradient(1px 1px at 160px 120px, #fff, transparent);
  background-size: 200px 200px; opacity: 0.4; animation: twinkle 4s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { opacity: 0.4; } 50% { opacity: 0.7; } }
.content { position: relative; z-index: 1; text-align: center; max-width: 500px; }
.code { font-size: clamp(6rem, 20vw, 12rem); font-weight: 800;
  letter-spacing: -0.05em; line-height: 0.9;
  background: linear-gradient(180deg, #fff 0%, #6366f1 50%, #a855f7 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 16px; animation: float 6s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-20px) rotate(1deg); } }
h1 { font-size: 1.5rem; margin-bottom: 12px; letter-spacing: -0.02em; }
p { color: #8888a0; margin-bottom: 32px; font-size: 0.95rem; }
.actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn { padding: 12px 24px; border-radius: 10px; font-weight: 600;
  font-size: 0.9rem; text-decoration: none; transition: all .2s; }
.btn-primary { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff;
  box-shadow: 0 10px 30px rgba(99,102,241,0.4); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(99,102,241,0.6); }
.btn-ghost { color: #f0f0f5; border: 1px solid rgba(255,255,255,0.15); }
.btn-ghost:hover { background: rgba(255,255,255,0.05); }
</style>
</head>
<body>
<div class="stars"></div>
<div class="content">
  <div class="code">404</div>
  <h1>Lost in space</h1>
  <p>The page you're looking for drifted off into the void. Let's get you back.</p>
  <div class="actions">
    <a href="/" class="btn btn-primary">← Go home</a>
    <a href="/contact" class="btn btn-ghost">Report broken link</a>
  </div>
</div>
</body>
</html>
