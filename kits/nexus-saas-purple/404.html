<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Nexus</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .err { text-align: center; max-width: 500px; position: relative; z-index: 1; }
  .err-code { font-size: clamp(6rem, 20vw, 12rem); font-weight: 800;
    letter-spacing: -0.05em; line-height: 0.9;
    background: linear-gradient(180deg, #fff 0%, #6366f1 50%, #a855f7 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 16px; animation: floaty 6s ease-in-out infinite; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-20px) rotate(1deg); }
  }
  .err h1 { font-size: 1.5rem; margin-bottom: 12px;
    letter-spacing: -0.02em; }
  .err p { color: var(--muted); margin-bottom: 32px; font-size: 0.95rem; }
  .err-actions { display: flex; gap: 12px;
    justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="err">
  <div class="err-code">404</div>
  <h1>Lost in space</h1>
  <p>The page you're looking for drifted off into the void. Let's get you back.</p>
  <div class="err-actions">
    <a href="index.html" class="btn btn-primary">← Go home</a>
    <a href="index.html#features" class="btn btn-ghost">See features</a>
  </div>
</div>
</body>
</html>
