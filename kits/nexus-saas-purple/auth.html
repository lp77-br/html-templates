<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Nexus</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .auth-wrap { width: 100%; max-width: 400px; position: relative; z-index: 1; }
  .auth-logo { display: block; text-align: center; font-weight: 700;
    font-size: 1.5rem; margin-bottom: 32px; }
  .auth-logo span { color: var(--accent); }
  .auth-card { background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 40px 32px;
    backdrop-filter: blur(20px); }
  .auth-card h1 { font-size: 1.5rem; margin-bottom: 8px;
    letter-spacing: -0.02em; }
  .auth-card > p { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.85rem; font-weight: 500;
    margin-bottom: 6px; color: var(--muted); }
  .field input { width: 100%; padding: 12px 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--fg); font-size: 0.95rem; font-family: inherit;
    transition: border-color .2s, box-shadow .2s; }
  .field input:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
  .field-row { display: flex; justify-content: space-between; align-items: center;
    margin: 20px 0; font-size: 0.85rem; }
  .field-row label { display: flex; align-items: center; gap: 6px;
    color: var(--muted); cursor: pointer; }
  .field-row a { color: var(--accent); }
  .auth-card .btn { width: 100%; margin-bottom: 20px; }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted);
    font-size: 0.8rem; margin: 24px 0; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px;
    background: var(--border); }
  .social { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .social-btn { display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 12px; background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--fg); font-size: 0.9rem; font-weight: 500; cursor: pointer;
    transition: all .2s; font-family: inherit; }
  .social-btn:hover { border-color: var(--border-strong);
    background: rgba(255,255,255,0.05); }
  .auth-footer { text-align: center; margin-top: 24px;
    color: var(--muted); font-size: 0.9rem; }
  .auth-footer a { color: var(--accent); font-weight: 500; }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="auth-wrap">
  <a href="index.html" class="auth-logo">Ne<span>xus</span></a>
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p>Sign in to continue building.</p>
    <form onsubmit="event.preventDefault();">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@company.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div class="field-row">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary">Sign in →</button>
    </form>
    <div class="divider">or continue with</div>
    <div class="social">
      <button type="button" class="social-btn">GitHub</button>
      <button type="button" class="social-btn">Google</button>
    </div>
    <p class="auth-footer">No account? <a href="#">Sign up free</a></p>
  </div>
</div>
</body>
</html>
